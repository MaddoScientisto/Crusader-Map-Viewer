<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crusader Map Renderer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0c12;
        color: #f4f7fb;
        font: 16px/1.5 "Segoe UI", sans-serif;
      }

      main {
        max-width: 640px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 10px;
        color: rgba(244, 247, 251, 0.82);
      }

      code {
        font-family: Consolas, "Cascadia Code", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vue Shell Required</h1>
      <p>This source HTML shell is no longer the runtime entry for the map renderer.</p>
      <p>Run <code>npm run dev</code>, <code>npm run admin</code>, or <code>npm run export-static</code> to generate the Vue application before opening this fallback shell.</p>
    </main>
  </body>
</html>
